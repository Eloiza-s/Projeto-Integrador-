<div class="login-shell">
  <div class="login-card">
    <div class="brand-area">
      <div class="brand-mark">G</div>
      <div>
        <p class="eyebrow">Acesso ao sistema</p>
        <h1>GeoInsights</h1>
      </div>
    </div>

    <form (ngSubmit)="submit()" novalidate>
      <label for="email">E-mail</label>
      <input id="email" type="email" name="email" [(ngModel)]="email" placeholder="admin@empresa.com" />

      <label for="password">Senha</label>
      <input id="password" type="password" name="password" [(ngModel)]="password" placeholder="••••••••" />

      <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>

      <button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <div class="hint-box">
      <strong>Credenciais de teste:</strong>
      <span>admin@empresa.com / admin123</span>
    </div>
  </div>
</div>
